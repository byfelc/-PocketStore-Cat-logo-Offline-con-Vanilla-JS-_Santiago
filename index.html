<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="PocketStore: catálogo offline con Vanilla JS" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>PocketStore</title>
</head>
<body>
  
  <header class="topbar">
    <h1> PocketStore</h1>
    <span id="net-status" class="badge online">En línea</span>
  </header>

  <main class="container">
  
  <section class="hero">
    <div class="hero-text">
      <h2>Tu catálogo, siempre contigo</h2>
      <p>Explora sin conexión. Cárgalo una vez y úsalo donde sea.</p>
    </div>
    <svg class="hero-art" viewBox="0 0 200 160" aria-hidden="true">
      <circle cx="100" cy="80" r="70" fill="rgba(255,255,255,.15)" />
      <rect x="55" y="60" width="90" height="70" rx="12" fill="#fff" />
      <path d="M78 60 v-10 a22 22 0 0 1 44 0 v10" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" />
      <circle cx="100" cy="95" r="14" fill="#4f46e5" />
      <path d="M93 95 l5 5 9-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </section>

  
 <section class="categorias" aria-label="Categorías">
  <button class="cat active" data-cat="todo"><span></span>Todo</button>
  <button class="cat" data-cat="Ropa"><span></span>Ropa</button>
  <button class="cat" data-cat="Audio"><span></span>Audio</button>
  <button class="cat" data-cat="Tech"><span></span>Tech</button>
  <button class="cat" data-cat="Hogar"><span></span>Hogar</button>
  <button class="cat" data-cat="Juegos"><span></span>Juegos</button>
</section>

  <input id="buscador" type="search" placeholder="Buscar por nombre o ciudad..." aria-label="Buscar" />
  <p id="mensaje" class="mensaje">Cargando catálogo...</p>
  <section id="lista" class="grid" aria-live="polite"></section>
</main>

  <footer class="footer">
    <p>PocketStore &copy; 2026 · Funciona sin conexión</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
